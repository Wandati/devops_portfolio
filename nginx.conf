server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Security Headers ──────────────────────────────────────────────────
    # Re-included in every location below that declares its own add_header;
    # nginx discards the inherited set otherwise. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ── App shell: never cache, so a new release is picked up immediately ─
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── Static Asset Caching ─────────────────────────────────────────────
    # Filenames are content-hashed at build time, so these are immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot|pdf)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── SPA Routing ───────────────────────────────────────────────────────
    # Unknown paths render the client-side NotFound component but keep a real
    # 404 status, so crawlers do not index every bogus path as a live page.
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
