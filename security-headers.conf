# ─────────────────────────────────────────────────────────────────────────────
# Canonical response-header set for the container runtime.
#
# nginx resets inherited add_header directives in any block that declares its
# own, so this file MUST be included in every location that adds a header of
# its own — otherwise that location silently serves unhardened responses.
#
# Keep in sync with vercel.json and the preview block in vite.config.js.
# ─────────────────────────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
